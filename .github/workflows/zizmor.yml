name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '10 4 * * 3' # weekly at 04:10 UTC on Wednesday
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@544059e5691c00818aa83bd1117c4e0b8b4a6e21 # v0.21.0
